name: Trigger auto deployment for ca-ftf-web-jpe

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-ftf-web-jpe-AutoDeployTrigger-b898a730-fc79-4dc3-87d0-d8ec374ce81d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAFTFWEBJPE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAFTFWEBJPE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAFTFWEBJPE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: ./Dockerfile
          registryUrl: crftfdeliveriesjpe.azurecr.io
          registryUsername: ${{ secrets.CAFTFWEBJPE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAFTFWEBJPE_REGISTRY_PASSWORD }}
          containerAppName: ca-ftf-web-jpe
          resourceGroup: rg-ftf-deliveries-jpe
          imageToBuild: crftfdeliveriesjpe.azurecr.io/ca-ftf-web-jpe:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


